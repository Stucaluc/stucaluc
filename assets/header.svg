<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Daniel Stucaluc</title>
  <desc id="d">Full Stack Developer, RPA and AI automation</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0b1d"/>
      <stop offset="1" stop-color="#0a0a12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B21B6"/>
      <stop offset=".5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#7C3AED" stop-opacity=".35"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#A78BFA" fill-opacity=".14"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="300" rx="16"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .in { opacity: 0; animation: up .7s cubic-bezier(.2,.8,.2,1) forwards; }
      .d1 { animation-delay: .1s; } .d2 { animation-delay: .3s; } .d3 { animation-delay: .5s; } .d4 { animation-delay: .7s; }
      @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { .in, .cursor { animation: none; opacity: 1; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>
    <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="299" rx="16" fill="none" stroke="#7C3AED" stroke-opacity=".35"/>

  <text class="mono in d1" x="64" y="78" font-size="17" fill="#A78BFA">~/stucaluc <tspan fill="#6e6a86">$ whoami</tspan></text>

  <text class="sans in d2" x="62" y="152" font-size="64" font-weight="700" fill="#f4f1ff" letter-spacing="-1.5">Daniel Stucaluc<tspan class="cursor" fill="#A78BFA">_</tspan></text>

  <text class="sans in d3" x="64" y="200" font-size="24" fill="#c4b5fd">Full Stack Developer · RPA &amp; AI Automation</text>

  <text class="mono in d4" x="64" y="252" font-size="15" fill="#8b85a6" xml:space="preserve">web systems <tspan fill="#7C3AED">/</tspan> rest apis <tspan fill="#7C3AED">/</tspan> mobile <tspan fill="#7C3AED">/</tspan> automation <tspan fill="#7C3AED">/</tspan> ai agents</text>

  <g class="mono in d4" text-anchor="end" font-size="14" fill="#6e6a86">
    <text x="1136" y="78">São Paulo, BR · remote</text>
  </g>

  <!-- animated node graph: systems talking to each other -->
  <defs><filter id="pk" x="-2" y="-2" width="5" height="5"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="7s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
    <g stroke="#7C3AED" stroke-opacity=".55" stroke-width="1.5" fill="none" stroke-linecap="round">
      <path id="e0" d="M900 170 L980 130" stroke-dasharray="91" stroke-dashoffset="91"><animate attributeName="stroke-dashoffset" from="91" to="0" begin="0.50s" dur=".6s" fill="freeze"/></path>
      <path id="e1" d="M980 130 L1060 165" stroke-dasharray="89" stroke-dashoffset="89"><animate attributeName="stroke-dashoffset" from="89" to="0" begin="0.62s" dur=".6s" fill="freeze"/></path>
      <path id="e2" d="M1060 165 L1010 225" stroke-dasharray="80" stroke-dashoffset="80"><animate attributeName="stroke-dashoffset" from="80" to="0" begin="0.74s" dur=".6s" fill="freeze"/></path>
      <path id="e3" d="M1010 225 L920 230" stroke-dasharray="92" stroke-dashoffset="92"><animate attributeName="stroke-dashoffset" from="92" to="0" begin="0.86s" dur=".6s" fill="freeze"/></path>
      <path id="e4" d="M920 230 L900 170" stroke-dasharray="65" stroke-dashoffset="65"><animate attributeName="stroke-dashoffset" from="65" to="0" begin="0.98s" dur=".6s" fill="freeze"/></path>
      <path id="e5" d="M980 130 L1010 225" stroke-dasharray="102" stroke-dashoffset="102"><animate attributeName="stroke-dashoffset" from="102" to="0" begin="1.10s" dur=".6s" fill="freeze"/></path>
      <path id="e6" d="M900 170 L1060 165" stroke-dasharray="162" stroke-dashoffset="162"><animate attributeName="stroke-dashoffset" from="162" to="0" begin="1.22s" dur=".6s" fill="freeze"/></path>
    </g>
    <circle r="2.6" fill="#DDD6FE" filter="url(#pk)" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="2.4s" begin="1.6s" repeatCount="indefinite"/><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite" calcMode="linear"><mpath href="#e0" xlink:href="#e0"/></animateMotion></circle>
    <circle r="2.6" fill="#A78BFA" filter="url(#pk)" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="2.0s" begin="2.4s" repeatCount="indefinite"/><animateMotion dur="2.0s" begin="2.4s" repeatCount="indefinite" calcMode="linear" keyPoints="1;0" keyTimes="0;1"><mpath href="#e1" xlink:href="#e1"/></animateMotion></circle>
    <circle r="2.6" fill="#DDD6FE" filter="url(#pk)" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="2.6s" begin="3.1s" repeatCount="indefinite"/><animateMotion dur="2.6s" begin="3.1s" repeatCount="indefinite" calcMode="linear"><mpath href="#e5" xlink:href="#e5"/></animateMotion></circle>
    <circle r="2.6" fill="#A78BFA" filter="url(#pk)" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="2.2s" begin="2.0s" repeatCount="indefinite"/><animateMotion dur="2.2s" begin="2.0s" repeatCount="indefinite" calcMode="linear" keyPoints="1;0" keyTimes="0;1"><mpath href="#e3" xlink:href="#e3"/></animateMotion></circle>
    <circle r="2.6" fill="#c4b5fd" filter="url(#pk)" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="3.0s" begin="2.8s" repeatCount="indefinite"/><animateMotion dur="3.0s" begin="2.8s" repeatCount="indefinite" calcMode="linear"><mpath href="#e6" xlink:href="#e6"/></animateMotion></circle>
    <circle r="2.6" fill="#DDD6FE" filter="url(#pk)" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="2.3s" begin="3.6s" repeatCount="indefinite"/><animateMotion dur="2.3s" begin="3.6s" repeatCount="indefinite" calcMode="linear" keyPoints="1;0" keyTimes="0;1"><mpath href="#e4" xlink:href="#e4"/></animateMotion></circle>
    <circle cx="900" cy="170" r="7" fill="#5B21B6"><animate attributeName="r" values="7;8.5;7" dur="2.8s" begin="0.00s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="130" r="9" fill="#7C3AED"><animate attributeName="r" values="9;10.5;9" dur="2.8s" begin="0.55s" repeatCount="indefinite"/></circle>
    <circle cx="1060" cy="165" r="7" fill="#A78BFA"><animate attributeName="r" values="7;8.5;7" dur="2.8s" begin="1.10s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="225" r="8" fill="#7C3AED"><animate attributeName="r" values="8;9.5;8" dur="2.8s" begin="1.65s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="230" r="6" fill="#A78BFA"><animate attributeName="r" values="6;7.5;6" dur="2.8s" begin="2.20s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="130" r="10" fill="none" stroke="#A78BFA" stroke-opacity="0"><animate attributeName="r" values="9;24" dur="3s" begin="0s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".55;0" dur="3s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="225" r="10" fill="none" stroke="#A78BFA" stroke-opacity="0"><animate attributeName="r" values="9;24" dur="3s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".55;0" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle>
  </g>
</svg>
