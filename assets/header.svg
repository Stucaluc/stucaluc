<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Daniel Stucaluc</title>
  <desc id="d">Full Stack Developer, RPA and AI automation</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0b1d"/>
      <stop offset="1" stop-color="#0a0a12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B21B6"/>
      <stop offset=".5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#7C3AED" stop-opacity=".35"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#A78BFA" fill-opacity=".14"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="300" rx="16"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .in { opacity: 0; animation: up .7s cubic-bezier(.2,.8,.2,1) forwards; }
      .d1 { animation-delay: .1s; } .d2 { animation-delay: .3s; } .d3 { animation-delay: .5s; } .d4 { animation-delay: .7s; }
      @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { .in, .cursor { animation: none; opacity: 1; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>
    <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="299" rx="16" fill="none" stroke="#7C3AED" stroke-opacity=".35"/>

  <text class="mono in d1" x="64" y="78" font-size="17" fill="#A78BFA">~/stucaluc <tspan fill="#6e6a86">$ whoami</tspan></text>

  <text class="sans in d2" x="62" y="152" font-size="64" font-weight="700" fill="#f4f1ff" letter-spacing="-1.5">Daniel Stucaluc<tspan class="cursor" fill="#A78BFA">_</tspan></text>

  <text class="sans in d3" x="64" y="200" font-size="24" fill="#c4b5fd">Full Stack Developer · RPA &amp; AI Automation</text>

  <text class="mono in d4" x="64" y="252" font-size="15" fill="#8b85a6" xml:space="preserve">web systems <tspan fill="#7C3AED">/</tspan> rest apis <tspan fill="#7C3AED">/</tspan> mobile <tspan fill="#7C3AED">/</tspan> automation <tspan fill="#7C3AED">/</tspan> ai agents</text>

  <g class="mono in d4" text-anchor="end" font-size="14" fill="#6e6a86">
    <text x="1136" y="78">São Paulo, BR · remote</text>
  </g>

  <!-- abstract node graph: systems talking to each other -->
  <g class="in d3" stroke="#7C3AED" stroke-opacity=".55" stroke-width="1.5" fill="none">
    <path d="M900 170 L980 130 L1060 165 L1010 225 L920 230 Z"/>
    <path d="M980 130 L1010 225 M900 170 L1060 165"/>
  </g>
  <g class="in d4">
    <circle cx="900" cy="170" r="7" fill="#5B21B6"/>
    <circle cx="980" cy="130" r="9" fill="#7C3AED"/>
    <circle cx="1060" cy="165" r="7" fill="#A78BFA"/>
    <circle cx="1010" cy="225" r="8" fill="#7C3AED"/>
    <circle cx="920" cy="230" r="6" fill="#A78BFA"/>
    <circle cx="980" cy="130" r="16" fill="none" stroke="#A78BFA" stroke-opacity=".35">
      <animate attributeName="r" values="10;22;10" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".5;0;.5" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
